name: Check booking links

# Weekly, and on demand. When a clinic renames or deletes a service in their booking
# tool, the Book button breaks silently - this is how we find out.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (early morning US)
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check booking links
        run: npm run check-links
