name: CI

# Runs validate, build and test on every push and PR. The repo stays private.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate configs
        run: npm run validate

      - name: Build engine and embeds
        run: npm run build

      - name: Check built artifacts are committed and current
        run: |
          if ! git diff --quiet -- dist embeds; then
            echo "::error::dist/ or embeds/ are out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist embeds
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
